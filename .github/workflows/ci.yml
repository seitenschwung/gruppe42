name: CI & Deploy

# Thin caller of the shared pipeline in seitenschwung/template. Owner-managed: the bot can't
# change workflow files. To pick up pipeline fixes, the owner moves the v1 tag in the template.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    # The called workflow can only use what is granted here.
    permissions:
      contents: read
      packages: write
    uses: seitenschwung/template/.github/workflows/pipeline.yml@v1
    secrets: inherit

  # Screenshots of the PR as a comment (optional; delete this job to go without). Also runs when the
  # tests fail, because that is when a picture helps most.
  preview:
    needs: pipeline
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: write
    uses: seitenschwung/template/.github/workflows/preview.yml@v1
    secrets: inherit
